services:
  - type: web
    name: taxrefresh-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: taxrefresh-postgres
          property: connectionString
      - key: DB_SSL
        value: "1"
      - key: CLIENT_ORIGIN
        value: https://taxrefreshdashboard.com,https://taxrefresh-auth.com,https://secure.taxrefresh.us
      - key: PUBLIC_BASE_URL
        value: https://secure.taxrefresh.us
      - key: EXPERIENCE_BASE_URL
        value: https://secure.taxrefresh.us
      - key: BOLDSIGN_8821_PDF_PATH
        value: ./assets/f8821.pdf
      - key: EXPERIAN_SOFT_PULL_URL
        value: https://sandbox-us-api.experian.com/consumerservices/credit-profile/v2/credit-report
      - key: EXPERIAN_OAUTH_TOKEN_URL
        value: https://sandbox-us-api.experian.com/oauth2/v1/token
      - key: EXPERIAN_OAUTH_SCOPE
        value: user
      - key: EXPERIAN_OAUTH_CLIENT_ID
        sync: false
      - key: EXPERIAN_OAUTH_CLIENT_SECRET
        sync: false
      - key: EXPERIAN_OAUTH_USERNAME
        value: farouk.dafer@taxrefresh.info
      - key: EXPERIAN_OAUTH_PASSWORD
        sync: false
      - key: EXPERIAN_SOFT_PULL_API_KEY
        sync: false
      - key: EXPERIAN_SOFT_PULL_API_KEY_HEADER
        value: x-api-key

databases:
  - name: taxrefresh-postgres
    databaseName: taxrefresh
    user: taxrefresh
